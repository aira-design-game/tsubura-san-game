<div class="cards"><button class="action" id="feed"><span class="icon">🦐</span>ごはん<small>おなか +18</small></button><button class="action" id="clean"><span class="icon">💧</span>おそうじ<small>きれい +20</small></button><button class="action" id="play"><span class="icon">🫧</span>あそぶ<small>ごきげん +16</small></button></div>
<section class="panel"><h2>水温を調整</h2><div class="temp"><span>15℃</span><input id="temp" type="range" min="15" max="25" step="0.5" value="20"><strong id="tempval">20℃</strong><span>25℃</span></div></section>
<section class="panel"><h2>成長メーター</h2><div class="xp"><span>レベル <strong id="level">1</strong></span><span><span id="xp">0</span> / 100 XP</span></div><div class="xpbar"><div class="xpfill" id="xpfill" style="width:0%"></div></div></section>
<section class="panel"><h2>できたこと</h2><div class="badges" id="badges"><span class="badge">🌱 はじめまして</span></div></section>
<div class="hint">こまめにお世話すると、ウパとの仲が深まります。</div>
</div>
<div id="toast" class="toast" style="display:none"></div>
<script>
const state={h:72,w:76,p:68,temp:20,xp:0,day:1,fed:0,clean:0,played:0};
const $=id=>document.getElementById(id);
function clamp(v){return Math.max(0,Math.min(100,v))}
function render(){
 $('hfill').style.width=state.h+'%';$('wfill').style.width=state.w+'%';$('pfill').style.width=state.p+'%';
 $('hval').textContent=Math.round(state.h);$('wval').textContent=Math.round(state.w);$('pval').textContent=Math.round(state.p);
 $('tempval').textContent=state.temp+'℃';$('level').textContent=Math.floor(state.xp/100)+1;$('xp').textContent=state.xp%100;$('xpfill').style.width=(state.xp%100)+'%';$('day').textContent='DAY '+state.day;
 let badges='<span class="badge">🌱 はじめまして</span>';
 if(state.fed>=1)badges+='<span class="badge">🦐 はじめてのごはん</span>';
 if(state.clean>=1)badges+='<span class="badge">💧 水の森メンテナンス</span>';
 if(state.played>=1)badges+='<span class="badge">🫧 なかよし</span>';
 if(state.xp>=100)badges+='<span class="badge">⭐ レベルアップ</span>';
 $('badges').innerHTML=badges;
}
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';clearTimeout(window._toast);window._toast=setTimeout(()=>el.style.display='none',1500)}
function bubbles(n=7){const tank=$('tank');for(let i=0;i<n;i++){const b=document.createElement('i');b.className='bubble';b.style.left=(10+Math.random()*80)+'%';b.style.bottom=(15+Math.random()*20)+'%';b.style.animationDelay=(Math.random()*.6)+'s';tank.appendChild(b);setTimeout(()=>b.remove(),3500)}}
function act(type){
 if(type==='feed'){state.h=clamp(state.h+18);state.p=clamp(state.p+5);state.xp+=18;state.fed++;toast('おいしく食べたよ！ 🦐');}
 if(type==='clean'){state.w=clamp(state.w+20);state.p=clamp(state.p+4);state.xp+=20;state.clean++;bubbles(10);toast('水の森がきれいになった！ 💧');}
 if(type==='play'){state.p=clamp(state.p+16);state.h=clamp(state.h-3);state.xp+=16;state.played++;bubbles(14);toast('ぷくぷく楽しい！ 🫧');}
 if(state.xp>=100)toast('レベルアップ！ ⭐');render();}
$('feed').onclick=()=>act('feed');$('clean').onclick=()=>act('clean');$('play').onclick=()=>act('play');
$('temp').oninput=e=>{state.temp=Number(e.target.value);render();toast('水温 '+state.temp+'℃')};
setInterval(()=>{state.day++;state.h=clamp(state.h-4);state.w=clamp(state.w-3);state.p=clamp(state.p-2);render()},18000);
render();
</script>
