<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#fffdf8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>ツブラさんのマルシェキャッチ！</title>
<style>@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

:root {
  --brown:#5b2d13;
  --cream:#fffaf0;
  --paper:#fffdf8;
  --orange:#f28c18;
  --green:#6e9d55;
  --turq:#5cb9b2;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body,#root { margin:0; min-height:100%; width:100%; }
body { background:#eee9df; font-family:'Zen Maru Gothic', system-ui, sans-serif; color:var(--brown); overscroll-behavior:none; }
button { font:inherit; }
.app { min-height:100dvh; display:flex; justify-content:center; }
.paper { width:min(100%, 520px); min-height:100dvh; background:var(--paper); overflow:hidden; position:relative; box-shadow:0 0 40px #5b2d1318; }
.topbar { height:70px; padding:12px 18px 5px; display:flex; justify-content:center; align-items:center; border-bottom:1px solid #5b2d1310; position:relative; z-index:4; }
.logo { width:125px; height:auto; object-fit:contain; }
.mini-brand { position:absolute; right:14px; top:27px; font-size:7px; letter-spacing:.16em; opacity:.45; font-weight:900; }
.title-screen { padding:14px 22px 28px; text-align:center; }
.hero-card { height:370px; border-radius:28px; background:linear-gradient(180deg,#f6eee1,#fffdf8); position:relative; overflow:hidden; border:1px solid #5b2d1310; }
.hero-card:after { content:""; position:absolute; left:-10%; right:-10%; bottom:-85px; height:170px; background:#dfe9d7; border-radius:50%; }
.sun { position:absolute; right:38px; top:24px; color:#f4c875; font-size:30px; opacity:.65; }
.hero-tubura { position:absolute; width:250px; height:275px; object-fit:contain; left:50%; bottom:15px; transform:translateX(-50%); z-index:2; }
.hero-copy { position:absolute; left:24px; top:30px; text-align:left; z-index:3; line-height:1.15; }
.hero-copy span { font-size:14px; display:block; }
.hero-copy strong { font-size:28px; letter-spacing:.03em; }
.tagline { font-size:13px; line-height:1.8; margin:18px 10px; }
.primary { width:100%; border:0; border-radius:999px; padding:15px 20px; background:var(--brown); color:white; font-weight:900; font-size:16px; box-shadow:0 7px 0 #3d1c0a; cursor:pointer; }
.primary:active { transform:translateY(5px); box-shadow:0 2px 0 #3d1c0a; }
.secondary { margin-top:12px; width:100%; border:1px solid #5b2d1340; border-radius:999px; padding:12px 20px; background:white; color:var(--brown); font-weight:700; cursor:pointer; }
.howto { margin:20px auto 10px; display:grid; grid-template-columns:45px 1fr; gap:8px 9px; align-items:center; max-width:310px; text-align:left; font-size:11px; }
.howto div { border-radius:10px; background:#f3eadc; padding:8px 5px; text-align:center; font-size:17px; }
.best { margin-top:18px; font-size:10px; letter-spacing:.14em; opacity:.55; }
.best b { font-size:16px; margin-left:5px; }
.game-screen { padding:10px 10px 20px; }
.hud { display:grid; grid-template-columns:1fr 70px 1fr; gap:8px; margin:0 3px 8px; }
.hud > div { background:#fff4e6; border:1px solid #5b2d1312; border-radius:13px; padding:6px 8px; display:flex; flex-direction:column; }
.hud > div:nth-child(2) { align-items:center; background:#5cb9b21a; }
.hud > div:last-child { align-items:flex-end; }
.hud small { font-size:7px; letter-spacing:.15em; opacity:.55; }
.hud b { font-size:17px; }
.stage { height:calc(100dvh - 185px); min-height:510px; max-height:690px; border-radius:24px; position:relative; overflow:hidden; background:linear-gradient(#eaf5ef 0 16%, #fffdf8 16% 100%); touch-action:none; border:1px solid #5b2d1315; }
.awning { position:absolute; top:0; left:0; right:0; height:42px; background:#5b2d13; display:flex; overflow:hidden; z-index:2; }
.awning i { flex:1; height:42px; background:#f7e8d0; clip-path:polygon(0 0,100% 0,84% 100%,16% 100%); }
.market-sign { position:absolute; top:51px; left:50%; transform:translateX(-50%); background:white; padding:7px 12px; border-radius:9px; font-family:Georgia,serif; font-weight:700; font-size:12px; white-space:nowrap; box-shadow:0 3px 12px #5b2d1310; z-index:2; }
.market-sign span { display:block; text-align:center; font-family:inherit; font-size:6px; letter-spacing:.1em; font-weight:400; }
.lane-lines { position:absolute; left:0; right:0; top:0; bottom:0; display:grid; grid-template-columns:1fr 1fr 1fr; pointer-events:none; }
.lane-lines i { border-right:1px dashed #5b2d1310; }
.falling { position:absolute; transform:translate(-50%,-50%); z-index:4; animation:float .55s ease-in-out infinite alternate; }
.product { width:58px; height:58px; display:grid; place-items:center; font-size:35px; filter:drop-shadow(0 6px 4px #5b2d1322); }
.bad .product { filter:grayscale(.3) drop-shadow(0 6px 4px #5b2d1322); }
.catch-zone { position:absolute; left:0; right:0; bottom:9%; height:115px; z-index:3; }
.catch-label { position:absolute; top:-2px; left:50%; transform:translateX(-50%); font-size:10px; background:#ffffffd9; border-radius:999px; padding:5px 10px; white-space:nowrap; box-shadow:0 2px 8px #5b2d1310; }
.player { position:absolute; bottom:7px; width:105px; height:105px; object-fit:contain; transform:translateX(-50%); transition:left .13s ease-out; filter:drop-shadow(0 7px 3px #5b2d1320); }
.shadow { position:absolute; bottom:5px; width:70px; height:12px; border-radius:50%; transform:translateX(-50%); background:#e7d9c5; transition:left .13s ease-out; }
.stall { position:absolute; bottom:0; width:90px; height:65px; background:#d8e8db; border-radius:15px 15px 0 0; text-align:center; padding-top:9px; font-size:7px; letter-spacing:.12em; opacity:.9; }
.stall b { display:block; font-size:22px; margin-top:3px; }
.stall-a { left:10px; } .stall-b { right:10px; background:#e9dfcf; }
.controls { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:9px 3px 0; }
.controls button { height:52px; border:0; border-radius:16px; background:#f1e4d4; color:var(--brown); font-size:30px; font-weight:900; box-shadow:0 4px 0 #d5c3ae; }
.controls button:active { transform:translateY(3px); box-shadow:0 1px 0 #d5c3ae; }
.tip { margin:7px 0 0; text-align:center; font-size:8px; opacity:.45; }
.combo-banner { height:0; position:relative; text-align:center; color:var(--orange); font-size:12px; font-weight:900; top:-18px; }
.shake { animation:shake .18s linear; }
.result-screen { padding:20px 25px 35px; text-align:center; }
.result-tubura { width:180px; height:180px; object-fit:contain; margin:5px auto 0; display:block; }
.result-title { font-size:19px; font-weight:900; margin:8px 0 18px; }
.result-score { background:#fff1df; border-radius:24px; padding:18px; }
.result-score small { display:block; font-size:8px; letter-spacing:.2em; opacity:.55; }
.result-score strong { display:block; font-size:50px; line-height:1; margin-top:5px; }
.result-best { display:inline-block; margin:14px 0; color:var(--orange); font-weight:900; font-size:11px; letter-spacing:.15em; }
.result-screen p { font-size:12px; line-height:1.8; color:#6b5a4e; }
footer { text-align:center; font-size:7px; letter-spacing:.16em; opacity:.28; padding:10px 0 16px; }
@keyframes float { from { transform:translate(-50%,-50%) rotate(-3deg); } to { transform:translate(-50%,-50%) rotate(3deg); } }
@keyframes shake { 0%,100%{transform:translateX(0)} 35%{transform:translateX(-5px)} 70%{transform:translateX(5px)} }
@media (max-height:700px) {
  .stage { height:calc(100dvh - 170px); min-height:465px; }
  .hero-card { height:325px; }
}
</style>
</head>
<body>
<div id="root"></div>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

const PRODUCTS = [
  { kind: "bread", emoji: "🥯", name: "ベーグル", points: 10, color: "#e8b35a" },
  { kind: "bread", emoji: "🥐", name: "パン", points: 12, color: "#d9903d" },
  { kind: "veg", emoji: "🥕", name: "野菜", points: 15, color: "#74a94b" },
  { kind: "veg", emoji: "🥬", name: "葉もの", points: 18, color: "#4d9560" },
  { kind: "bad", emoji: "🧺", name: "空カゴ", points: -8, color: "#b7a18d" },
];

const LANES = [16.67, 50, 83.33];

function randProduct() {
  const r = Math.random();
  if (r < 0.36) return PRODUCTS[0];
  if (r < 0.60) return PRODUCTS[1];
  if (r < 0.82) return PRODUCTS[2];
  if (r < 0.94) return PRODUCTS[3];
  return PRODUCTS[4];
}

function App() {
  const [screen, setScreen] = useState("title");
  const [score, setScore] = useState(0);
  const [combo, setCombo] = useState(0);
  const [best, setBest] = useState(() => Number(localStorage.getItem("tuburaBest") || 0));
  const [timeLeft, setTimeLeft] = useState(45);
  const [playerLane, setPlayerLane] = useState(1);
  const [items, setItems] = useState([]);
  const [message, setMessage] = useState("マルシェをひらこう！");
  const [shake, setShake] = useState(false);
  const areaRef = useRef(null);
  const itemId = useRef(0);
  const lastSpawn = useRef(0);
  const raf = useRef(0);
  const scoreRef = useRef(0);
  const startAt = useRef(0);
  const playerLaneRef = useRef(1);

  useEffect(() => { scoreRef.current = score; }, [score]);

  const startGame = () => {
    scoreRef.current = 0;
    setScore(0);
    setCombo(0);
    setTimeLeft(45);
    setPlayerLane(1);
    playerLaneRef.current = 1;
    setItems([]);
    setMessage("パンと野菜をあつめよう！");
    setScreen("game");
    startAt.current = performance.now();
    lastSpawn.current = 0;
  };

  const finishGame = () => {
    cancelAnimationFrame(raf.current);
    setItems([]);
    const finalScore = scoreRef.current;
    setBest(prev => {
      const next = Math.max(prev, finalScore);
      localStorage.setItem("tuburaBest", String(next));
      return next;
    });
    setScreen("result");
  };

  const move = (dir) => {
    if (screen !== "game") return;
    const next = Math.max(0, Math.min(2, playerLaneRef.current + dir));
    playerLaneRef.current = next;
    setPlayerLane(next);
  };

  const pointerMove = (e) => {
    if (screen !== "game" || !areaRef.current) return;
    const rect = areaRef.current.getBoundingClientRect();
    const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
    const lane = x < rect.width / 3 ? 0 : x < rect.width * 2 / 3 ? 1 : 2;
    playerLaneRef.current = lane;
    setPlayerLane(lane);
  };

  useEffect(() => {
    if (screen !== "game") return;
    const tick = (now) => {
      const elapsed = (now - startAt.current) / 1000;
      const remain = Math.max(0, 45 - elapsed);
      setTimeLeft(Math.ceil(remain));

      if (remain <= 0) {
        finishGame();
        return;
      }

      if (now - lastSpawn.current > Math.max(330, 650 - elapsed * 4)) {
        lastSpawn.current = now;
        const product = randProduct();
        setItems(prev => [...prev, {
          id: itemId.current++,
          lane: Math.floor(Math.random() * 3),
          y: -12,
          speed: 0.17 + Math.min(0.10, elapsed / 450),
          product
        }]);
      }

      setItems(prev => {
        let gained = 0;
        let hit = false;
        const next = [];
        for (const item of prev) {
          const y = item.y + item.speed;
          const caught = y > 78 && y < 91 && item.lane === playerLaneRef.current;
          if (caught) {
            gained += item.product.points;
            hit = true;
            if (item.product.points > 0) {
              setCombo(c => c + 1);
              setMessage(item.product.name + "ゲット！");
            } else {
              setCombo(0);
              setMessage("空カゴだった！");
              setShake(true);
              setTimeout(() => setShake(false), 180);
            }
          } else if (y < 108) {
            next.push({ ...item, y });
          }
        }
        if (gained) setScore(s => Math.max(0, s + gained));
        if (!hit && prev.length > 0 && Math.random() < 0.012) setMessage("いい調子！");
        return next;
      });

      raf.current = requestAnimationFrame(tick);
    };
    raf.current = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf.current);
  }, [screen]);

  const comboLabel = useMemo(() => combo >= 10 ? "マルシェ名人！" : combo >= 5 ? "いい流れ！" : "", [combo]);

  return (
    <main className="app">
      <div className="paper">
        <header className="topbar">
